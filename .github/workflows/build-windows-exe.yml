name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $outDir = "release_artifacts/windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $versionSpec = ((Select-String -Path "pubspec.yaml" -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value).Trim()
          $parts = $versionSpec.Split('+')
          $version = $parts[0]
          $build = $parts[1]
          $outputName = "AI-VOC-Assistant-v$version-build$build-Setup"
          iscc "/DMyAppVersion=$version" "/DMyAppBuild=$build" "windows\installer\AI-VOC-Assistant.iss"
          $setupPath = Join-Path $outDir "$outputName.exe"
          $hash = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $outputName.exe" | Set-Content (Join-Path $outDir "$outputName.exe.sha256")
          "OUTPUT_NAME=$outputName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Archive Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: |
            release_artifacts/windows/${{ env.OUTPUT_NAME }}.exe
            release_artifacts/windows/${{ env.OUTPUT_NAME }}.exe.sha256
