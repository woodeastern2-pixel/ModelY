name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $outDir = "release_artifacts/windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          iscc "windows\installer\AI-VOC-Assistant.iss"
          $setupPath = Join-Path $outDir "AI-VOC-Assistant-Setup.exe"
          $hash = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLower()
          "$hash  AI-VOC-Assistant-Setup.exe" | Set-Content (Join-Path $outDir "AI-VOC-Assistant-Setup.exe.sha256")

      - name: Archive Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-VOC-Assistant-Windows-Installer
          path: |
            release_artifacts/windows/AI-VOC-Assistant-Setup.exe
            release_artifacts/windows/AI-VOC-Assistant-Setup.exe.sha256
