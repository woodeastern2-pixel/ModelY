name: Record actual privacy page pickup
on:
  push:
    branches: [work/voc-mate-desktop-recording]
    paths:
      - integration_test/privacy_pickup_test.dart
      - .github/workflows/privacy-demo-pickup.yml
permissions:
  contents: read
jobs:
  privacy-pickup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Prepare recording
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev xvfb openbox xdotool wmctrl ffmpeg dbus-x11 fonts-noto-cjk
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          p.write_text(p.read_text().replace('dev_dependencies:\n','dev_dependencies:\n  integration_test:\n    sdk: flutter\n'))
          PY
          flutter pub get
          flutter analyze integration_test/privacy_pickup_test.dart --no-fatal-infos --no-fatal-warnings
      - name: Record real privacy screen
        run: |
          mkdir -p artifacts
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- bash -c 'openbox --sm-disable > artifacts/window-manager.log 2>&1 & LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 flutter drive --profile -d linux --driver=test_driver/full_demo_driver.dart --target=integration_test/privacy_pickup_test.dart' 2>&1 | tee artifacts/privacy-driver.log
          test -f artifacts/privacy-verified.txt
          ffmpeg -v error -xerror -i artifacts/VOC_Mate_Privacy_Actual.mp4 -f null -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-pickup
          path: artifacts/
          retention-days: 30
