name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release
          VERSION_SPEC=$(awk '/^version:/{print $2}' pubspec.yaml)
          APP_VERSION=${VERSION_SPEC%%+*}
          BUILD_NUMBER=${VERSION_SPEC##*+}
          OUTPUT_NAME="AI-VOC-Assistant-v${APP_VERSION}-build${BUILD_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${OUTPUT_NAME}.apk"
          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: build/app/outputs/flutter-apk/${{ env.OUTPUT_NAME }}.apk
