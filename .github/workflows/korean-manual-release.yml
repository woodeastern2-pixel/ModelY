name: VoC Mate Korean manual release
on:
  push:
    branches: [work/korean-manual-retrieval]
  workflow_dispatch:
env:
  CI: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
permissions:
  contents: read
concurrency:
  group: voc-korean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Compare with the previous application
        run: |
          git fetch --no-tags --depth=1 origin 3c33a98d0ff23301992094efa1ca0e597353b578
          git worktree add --detach /tmp/voc-before-korean 3c33a98d0ff23301992094efa1ca0e597353b578
          python3 - <<'PYUI'
          import pathlib, re, shutil, subprocess
          baseline = pathlib.Path('/tmp/voc-before-korean')
          # Historical committed goldens still contain the former product name.
          # Compare against the actual presentation app before this retrieval change;
          # normalize only the release number in its footer.
          current = pathlib.Path('lib/core/constants/app_constants.dart').read_text()
          old_file = baseline/'lib/core/constants/app_constants.dart'
          old = old_file.read_text()
          for field in ('appVersion','appBuildNumber'):
              value = re.search(r'(static const (?:String|int) '+field+r' = [^;]+;)', current).group(1)
              old = re.sub(r'static const (?:String|int) '+field+r' = [^;]+;', value, old)
          old_file.write_text(old)
          shutil.copy2('pubspec.lock',baseline/'pubspec.lock')
          subprocess.run(['flutter','pub','get'],cwd=baseline,check=True)
          tests=['test/ui_preview_golden_test.dart','test/workspace_ui_preview_golden_test.dart']
          subprocess.run(['flutter','test','--update-goldens',*tests],cwd=baseline,check=True)
          for image in (baseline/'test/goldens').glob('*.png'):
              shutil.copy2(image,pathlib.Path('test/goldens')/image.name)
          subprocess.run(['flutter','test','--concurrency=1','--exclude-tags=recording'],check=True)
          PYUI
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voc-mate-korean-quality
          path: |
            pubspec.lock
            test/failures/
            test/goldens/*.json
          if-no-files-found: warn
  android:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM for virtual Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Korean originals in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            flutter drive --driver=test_driver/full_demo_driver.dart --target=integration_test/korean_manual_runtime_test.dart -d emulator-5554
            mkdir -p artifacts
            cp build/integration_response_data.json artifacts/korean-manual-runtime-android.json
      - name: Android compatibility build
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: voc-mate-korean-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            artifacts/korean-manual-runtime-android.json
          if-no-files-found: error
  windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Run Korean originals in Windows virtual machine
        shell: pwsh
        run: |
          flutter drive --driver=test_driver/full_demo_driver.dart --target=integration_test/korean_manual_runtime_test.dart -d windows --profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item build/integration_response_data.json artifacts/korean-manual-runtime-windows.json
      - name: Cache verified model and runtime
        uses: actions/cache@v4
        with:
          path: .qwen-build-cache
          key: qwen3-1.7b-q8-061b54da-llama-b9380
      - name: Include model, runtime and licenses
        run: python tool/prepare_bundled_qwen.py build/windows/x64/runner/Release/local_ai
      - name: Run actual model in native Windows application
        shell: pwsh
        run: |
          $env:VOC_QWEN_SMOKE_ROOT = (Resolve-Path 'build/windows/x64/runner/Release/local_ai').Path
          flutter drive --driver=test_driver/full_demo_driver.dart --target=integration_test/bundled_qwen_smoke_test.dart -d windows --profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build offline installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup --no-progress -y }
          & $compiler '/DMyAppVersion=1.1.27' '/DMyAppBuild=29' windows/installer/AI-VOC-Assistant.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release_artifacts/windows/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voc-mate-korean-windows
          compression-level: 0
          path: |
            release_artifacts/windows/*
            artifacts/bundled-qwen-smoke.json
            artifacts/korean-manual-runtime-windows.json
            build/windows/x64/runner/Release/local_ai/manifest.json
          if-no-files-found: warn
