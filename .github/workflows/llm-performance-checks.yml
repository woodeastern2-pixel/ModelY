name: VoC Mate local LLM compatibility
on:
  push:
    branches: [work/voc-mate-quality-recording]
    paths: ['lib/**', 'test/**', 'pubspec.yaml', '.github/workflows/llm-performance-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run regression suite
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          tests = [str(p) for p in sorted(pathlib.Path('test').rglob('*_test.dart')) if p.name != 'recording_peer_test.dart']
          subprocess.run(['flutter','test','--fail-fast','--exclude-tags=golden',*tests],check=True)
          PY
  windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/cache@v4
        with:
          path: .qwen-build-cache
          key: qwen3-1.7b-q8-061b54da-llama-b9380
      - run: python tool/prepare_bundled_qwen.py build/windows/x64/runner/Release/local_ai
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/windows/x64/runner/Release/ai_voc_assistant.exe')) { throw 'Windows executable missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: voc-mate-local-llm-windows
          compression-level: 0
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
  android:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: voc-mate-local-llm-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
